<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Practice</title>
<style>
:root{
  --paper:#FFFDF7;
  --ink:#1E1B18;
  --faded:#A9A29A;
  --crayon-blue:#2C6FB5;
  --crayon-green:#4E9A3E;
  --crayon-red:#D93A2B;
  --sun:#FFD23F;
  --line:#E4DED2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#243138;color:var(--ink);min-height:100%}
body{
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Avenir Next",system-ui,sans-serif;
  font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}

/* ---------- phone frame ---------- */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 16px}
.device{position:relative;width:390px;height:min(844px,90vh);flex:none;
  background:#0E1214;border-radius:46px;padding:11px;
  box-shadow:0 0 0 2px #3A474E,0 30px 60px rgba(0,0,0,.45)}
.island{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;background:#0E1214;border-radius:999px;z-index:20;pointer-events:none}
.screen{position:relative;height:100%;width:100%;overflow-y:auto;overflow-x:hidden;
  border-radius:36px;background:var(--paper);-webkit-overflow-scrolling:touch}
.stagenote{color:#8FA0A9;font-size:13px;margin:0;text-align:center}
@media (max-width:760px){
  .stage{padding:0;min-height:100dvh;gap:0}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .island{display:none}
  .screen{border-radius:0}
  .sheet{left:0;right:0;top:0;bottom:0;border-radius:0}
  .stagenote{display:none}
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- cover ---------- */
#cover{min-height:100%;padding-top:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:32px 24px}
#cover img{width:min(62vw,240px);border-radius:3px;box-shadow:0 10px 30px rgba(30,27,24,.18);transform:rotate(-1.6deg)}
#cover img:not([src]){display:none}
#cover h1{font-size:34px;line-height:1.1;margin:6px 0 0;font-weight:800;letter-spacing:-.01em}
#cover p{margin:0;color:var(--faded);font-size:14px;max-width:32ch}
.start{background:var(--crayon-green);color:#fff;font-weight:800;font-size:20px;padding:16px 40px;border-radius:999px;box-shadow:0 6px 0 #3d7a30;margin-top:8px}
.start:active{transform:translateY(3px);box-shadow:0 3px 0 #3d7a30}
.start:disabled{background:var(--faded);box-shadow:0 6px 0 #8d8780;cursor:default}
.start:disabled:active{transform:none;box-shadow:0 6px 0 #8d8780}
.credit{font-size:12px;color:var(--faded);line-height:1.6;max-width:34ch}
.credit a{color:var(--faded)}
.oops{color:var(--crayon-red);font-size:15px;font-weight:700;max-width:30ch}
.oops a{color:var(--crayon-red)}

/* ---------- app chrome ---------- */
#app{display:none;min-height:100%;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:44px 18px 6px;max-width:520px;margin:0 auto;width:100%}
header .who{font-size:14px;color:var(--faded)}
header .pg{font-size:14px;color:var(--faded);font-variant-numeric:tabular-nums}
.lib{font-size:14px;color:var(--faded);text-decoration:none;font-weight:700;flex:none}
main{flex:1}

/* ---------- picture ---------- */
.pic{display:block;width:100%;border-radius:4px;background:#fff;box-shadow:0 6px 18px rgba(30,27,24,.12);transform:rotate(-.7deg);margin:6px 0 22px}

/* ---------- story text ---------- */
#text{font-size:25px;line-height:1.62;letter-spacing:-.005em;margin-bottom:20px}
.sent{color:var(--faded);transition:color .18s}
.sent.on{color:var(--ink)}
.sent.tapme{cursor:pointer}
.w{border-radius:4px;padding:1px 1px;transition:background .09s}
.w.on{background:var(--sun);box-shadow:0 0 0 3px var(--sun)}

/* ---------- controls ---------- */
.bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 76%,rgba(255,253,247,0));padding:10px 18px calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;width:100%}
.row{display:flex;align-items:center;gap:10px}
.row+.row{margin-top:10px}
.big{flex:1;background:var(--crayon-blue);color:#fff;font-weight:800;font-size:19px;padding:15px;border-radius:14px;box-shadow:0 4px 0 #1f5288}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #1f5288}
.big.stop{background:var(--crayon-red);box-shadow:0 4px 0 #a52a1e}
.big.listening{background:var(--crayon-red);box-shadow:0 4px 0 #a52a1e;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}
.hint.big-hint{font-size:15px;font-weight:800;color:var(--crayon-red)}
.nav{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);font-size:22px;font-weight:700;color:var(--ink)}
.nav:disabled{opacity:.3}
.chip{border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--faded)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rec{border:2px solid var(--crayon-red);color:var(--crayon-red);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700}
.rec.live{background:var(--crayon-red);color:#fff}
.spacer{flex:1}
.modes{display:flex;gap:5px;background:#F0EAE0;border-radius:999px;padding:4px;margin-bottom:9px}
.mode{flex:1;font-size:13px;font-weight:800;color:var(--faded);padding:9px 2px;border-radius:999px;text-align:center;line-height:1.15}
.mode.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(30,27,24,.16)}
.w.ok{background:#CFEDC2}
.w.miss{background:#FBD8D3}
.result{background:#F0EAE0;border-radius:16px;padding:14px 16px;margin-top:14px;font-size:16px;line-height:1.45}
.result b{font-size:22px;display:block;margin-bottom:2px}
.hbtns{display:flex;gap:8px}
.icon{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font-size:16px;line-height:1;flex:none}
.icon.live{background:var(--crayon-red);border-color:var(--crayon-red);color:#fff}
.sheet{position:absolute;left:11px;right:11px;top:11px;bottom:11px;border-radius:36px;overflow:hidden;z-index:30;display:none}
.sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(30,27,24,.34)}
.sheetin{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;padding:16px 18px 22px;box-shadow:0 -12px 34px rgba(0,0,0,.2)}
.sheetin h3{font-size:13px;font-weight:800;color:var(--faded);margin:18px 0 9px}
.sheetin h3:first-child{margin-top:2px}
.done{width:100%;background:var(--ink);color:var(--paper);font-weight:800;font-size:17px;padding:14px;border-radius:14px;margin-top:20px}
.vsel{flex:1;font:inherit;font-size:14px;font-weight:700;color:var(--faded);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:7px 12px;min-width:0}
.hint{font-size:13px;color:var(--faded);text-align:center;min-height:18px;margin-top:6px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;justify-content:center;padding:4px 0 10px}
.tab{font-size:15px;font-weight:700;color:var(--faded);padding:6px 14px;border-radius:999px}
.tab.on{color:var(--ink);background:#F0EAE0}

/* ---------- words ---------- */
.word{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.word b{font-size:23px;min-width:5.5ch}
.word span{font-size:15px;color:var(--faded);line-height:1.35}
.word .zh{color:var(--ink);font-size:17px}
.say{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--sun);font-size:19px;flex:none}

/* ---------- quiz ---------- */
.q{margin:0 0 10px;font-size:21px;font-weight:700;line-height:1.35}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:18px;margin-bottom:10px}
.opt.right{border-color:var(--crayon-green);background:#EDF7EA}
.opt.wrong{border-color:var(--crayon-red);background:#FCEDEB}
.score{font-size:26px;font-weight:800;text-align:center;margin:30px 0 10px}
.again{display:block;margin:0 auto;border:2px solid var(--line);border-radius:999px;padding:11px 22px;font-weight:700}
audio{width:100%;margin-top:10px}
.warn{font-size:13px;color:var(--crayon-red);text-align:center;padding:8px 0}

/* ---------- teacher recording page ---------- */
.tpage{position:absolute;left:11px;right:11px;top:11px;bottom:11px;border-radius:36px;
  background:var(--paper);z-index:40;display:none;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch}
.tpage.open{display:block}
@media (max-width:760px){ .tpage{left:0;right:0;top:0;bottom:0;border-radius:0} }
.tin{padding:calc(16px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto}
.tback{font-size:18px;font-weight:800;color:var(--faded);padding:10px 4px 10px 0;min-height:48px}
.th{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:4px 0 2px;line-height:1.1}
.tsub{margin:0 0 14px;color:var(--faded);font-size:15px}
.tsay{margin:0 0 16px;font-size:18px;line-height:1.45;background:#F0EAE0;border-radius:16px;padding:14px 16px}
.tprog{margin:0 0 6px;font-size:22px;font-weight:800}
.trow{display:flex;align-items:center;gap:13px;padding:18px 0;border-bottom:2px solid var(--line)}
.trow.cur{background:#FFFBEB;border-radius:14px;padding:18px 12px;margin:0 -12px}
.trow.live{background:#FCEDEB;border-radius:14px;padding:18px 12px;margin:0 -12px}
.ttext{flex:1;min-width:0;font-size:21px;line-height:1.35}
.tnum{font-weight:800;color:var(--faded)}
.trow.tdone .ttext{color:var(--faded)}
.tmeta{font-size:15px;font-weight:700;color:var(--faded);margin-top:6px}
.trow.tdone .tmeta{color:var(--crayon-green)}
.trow.live .tmeta{color:var(--crayon-red)}
.tbtn{width:72px;height:72px;border-radius:50%;flex:none;font-size:30px;line-height:1;
  border:4px solid var(--crayon-red);color:var(--crayon-red);background:var(--paper)}
.tbtn:active{transform:scale(.94)}
.tbtn.live{background:var(--crayon-red);color:#fff;animation:pulse 1.1s ease-in-out infinite}
.tplay{width:62px;height:62px;border-radius:50%;flex:none;font-size:24px;line-height:1;
  border:4px solid var(--line);color:var(--ink);background:var(--paper)}
.tplay:active{transform:scale(.94)}
.tplay:disabled{opacity:.28}
.tstatus{margin:16px 0 0;font-size:17px;line-height:1.45;font-weight:700;text-align:left;color:var(--crayon-green);display:none}
.tstatus.show{display:block}
.tstatus.tbad{color:var(--crayon-red)}
.tsend{width:100%;background:var(--crayon-green);color:#fff;font-weight:800;font-size:23px;
  padding:22px;border-radius:18px;box-shadow:0 6px 0 #3d7a30;margin-top:22px}
.tsend:active{transform:translateY(3px);box-shadow:0 3px 0 #3d7a30}
.tsend:disabled{background:var(--faded);box-shadow:0 6px 0 #8d8780}
.tsend:disabled:active{transform:none;box-shadow:0 6px 0 #8d8780}
.tnote{margin:14px 0 0;font-size:14px;color:var(--faded);line-height:1.5;text-align:center}
.sheetbig{width:100%;border:3px solid var(--crayon-red);color:var(--crayon-red);
  border-radius:14px;padding:16px;font-size:18px;font-weight:800}
</style>
</head>
<body>

<div class="stage">
<div class="device">
<div class="island"></div>
<div class="screen" id="screen">

<div id="cover" class="wrap">
  <img id="coverimg" alt="">
  <h1 id="covertitle">&nbsp;</h1>
  <p id="covertag"></p>
  <button class="start" id="startBtn" disabled>Loading&hellip;</button>
  <p class="credit" id="covercredit"></p>
  <p class="oops" id="coveroops" style="display:none"></p>
</div>

<div id="app">
  <header>
    <a class="lib" href="index.html" title="All books">&lsaquo; Books</a>
    <span class="pg" id="pgnum"></span>
    <span class="hbtns">
      <button class="icon" id="recBtn" title="Record your reading">&#127908;</button>
      <button class="icon" id="gear" title="Settings">&#9881;</button>
    </span>
  </header>

  <main class="wrap">
    <div class="tabs">
      <button class="tab on" data-v="read">Story</button>
      <button class="tab" data-v="words">Words</button>
      <button class="tab" data-v="quiz">Quiz</button>
    </div>

    <section id="v-read">
      <img class="pic" id="pic" alt="">
      <div id="text"></div>
    </section>

    <section id="v-words" style="display:none"></section>
    <section id="v-quiz" style="display:none"></section>
  </main>

  <div class="bar" id="bar">
    <div class="modes">
      <button class="mode on" data-mode="listen">Read<br>to me</button>
      <button class="mode" data-mode="echo">My turn<br>to read</button>
      <button class="mode" data-mode="practice">Score<br>my reading</button>
    </div>
    <div class="row">
      <button class="nav" id="prev">&lsaquo;</button>
      <button class="big" id="play">Read to me</button>
      <button class="nav" id="next">&rsaquo;</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</div>

</div><!--screen-->

<div class="sheet" id="sheet">
  <div class="scrim" id="scrim"></div>
  <div class="sheetin">
    <h3>Reading speed</h3>
    <div class="row">
      <button class="chip" data-rate=".4">Very slow</button>
      <button class="chip" data-rate=".7">Slow</button>
      <button class="chip on" data-rate="1">Normal</button>
      <button class="chip" data-rate="1.35">Fast</button>
    </div>
    <h3>Voice</h3>
    <div class="row">
      <select id="voicesel" class="vsel"></select>
      <button class="chip" id="tryvoice">Hear it</button>
    </div>
    <audio id="playback" controls style="display:none"></audio>
    <h3>For the teacher</h3>
    <button class="sheetbig" id="teachbtn">&#127908; Record this page</button>
    <button class="done" id="done">Done</button>
  </div>
</div>

<div class="tpage" id="tpage">
  <div class="tin">
    <button class="tback" id="tback">&lsaquo; Back to the book</button>
    <h2 class="th">Record this page</h2>
    <p class="tsub" id="ttitle"></p>
    <p class="tsay">Read one sentence out loud. Tap the round red button to start, then tap the same button again to stop.</p>
    <p class="tprog" id="tprog"></p>
    <div id="trows"></div>
    <p class="tstatus" id="tstatus"></p>
    <button class="tsend" id="tsend">Send these recordings</button>
    <p class="tnote" id="tnote">The recordings stay on this phone until you send them.</p>
  </div>
</div>
</div><!--device-->
<p class="stagenote">Phone preview — resize narrow, or open on a phone, for the real thing</p>
</div><!--stage-->

<script src="reading-log.js?v=1789217203"></script>
<script src="who.js?v=1789217203"></script>
<script>
/* ---------- which book? ---------- */
const DEFAULT_BOOK = "lindas-surprise";
function wantedSlug(){
  const q=new URLSearchParams(location.search).get("book");
  if(!q) return DEFAULT_BOOK;
  // keep this to a plain folder name — no slashes, no walking up the tree
  return /^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(q) ? q : null;
}
const slug=wantedSlug();
const BASE="books/"+slug+"/";

/* ---------- book data, filled in by loadBook() ---------- */
let BOOK=null, PAGES=[], WORDS=[], QUIZ=[];
const imgSrc=key=>BASE+(BOOK.images[key]||key+".webp");

/* ---------- state ---------- */
let page=0, rate=1, mode="listen", speaking=false, view="read";
try{ const r=parseFloat(localStorage.getItem("rate")); if(r>0) rate=r; }catch(e){}
let scores=[], sr=null;
let tokens=[], curSent=-1, timers=[], voice=null;
let AUDIO=null, clip=null, clipRateAdj=1;  // pre-rendered narration, when the book has it
const $=id=>document.getElementById(id);

/* ---------- voice ---------- */
function enVoices(){
  return speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));
}
function pickVoice(){
  const v=enVoices();
  if(!v.length) return null;
  const saved=localStorage.getItem("voiceName");
  if(saved){const m=v.find(x=>x.name===saved); if(m) return m;}
  // premium and enhanced voices first — they are the big quality jump
  const grade=x=>/premium/i.test(x.name)?3:/enhanced/i.test(x.name)?2:1;
  const liked=["Ava","Allison","Zoe","Samantha","Nicky","Karen","Serena"];
  const rank=x=>{const i=liked.findIndex(n=>x.name.includes(n));return i<0?99:i};
  return v.slice().sort((a,b)=>grade(b)-grade(a)||rank(a)-rank(b))[0];
}
function fillVoiceMenu(){
  const sel=$("voicesel"); if(!sel) return;
  const v=enVoices(); sel.innerHTML="";
  v.forEach(x=>{
    const o=document.createElement("option");
    o.value=x.name; o.textContent=x.name;
    if(voice&&x.name===voice.name) o.selected=true;
    sel.appendChild(o);
  });
  sel.style.display=v.length>1?"":"none";
}
speechSynthesis.onvoiceschanged=()=>{voice=pickVoice();fillVoiceMenu()};
voice=pickVoice();

/* ---------- render a page ---------- */
function tokenize(sentence){
  const out=[];const re=/\S+/g;let m;
  while((m=re.exec(sentence))!==null) out.push({t:m[0],i:m.index});
  return out;
}
function prefetch(i){
  if(i<0||i>=PAGES.length) return;
  const im=new Image(); im.src=imgSrc(PAGES[i].img);
}
function drawPage(){
  const p=PAGES[page];
  Track&&Track.log("page_view",{slug:slug,page:page+1});
  $("pic").src=imgSrc(p.img);
  $("pgnum").textContent=(page+1)+" / "+PAGES.length;
  const box=$("text"); box.innerHTML=""; tokens=[];
  p.s.forEach((sent,si)=>{
    const span=document.createElement("span");
    span.className="sent tapme"; span.dataset.si=si;
    const toks=tokenize(sent); tokens[si]=[];
    toks.forEach((tk,wi)=>{
      const w=document.createElement("span");
      w.className="w"; w.textContent=tk.t; w.dataset.si=si; w.dataset.wi=wi; w.dataset.ci=tk.i;
      span.appendChild(w); span.appendChild(document.createTextNode(" "));
      tokens[si].push(w);
    });
    box.appendChild(span); box.appendChild(document.createTextNode(" "));
  });
  clearMarks();
  $("prev").disabled=page===0;
  $("next").disabled=page===PAGES.length-1;
  clearHi();
  prefetch(page+1);
}
function clearHi(){
  document.querySelectorAll(".sent.on").forEach(e=>e.classList.remove("on"));
  document.querySelectorAll(".w.on").forEach(e=>e.classList.remove("on"));
}
function clearMarks(){
  document.querySelectorAll(".w.ok,.w.miss").forEach(e=>e.classList.remove("ok","miss"));
  const r=document.getElementById("result"); if(r) r.remove();
}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

/* ---------- pre-rendered narration -------------------------------------
   When a book ships an audio/ folder, sentences are played from file instead
   of spoken by the device, so every phone reads in the same voice. Anything
   without audio still goes through speechSynthesis exactly as before.      */
const clipName=si=>"p"+(page+1)+"_s"+(si+1)+"."+((AUDIO&&AUDIO.ext)||"m4a");
const clipInfo=si=>(AUDIO&&AUDIO.clips&&AUDIO.clips[clipName(si)])||null;
const clipUrl=si=>clipInfo(si)?BASE+"audio/"+clipName(si):null;
/* Each clip carries its own nudge toward the book's target pace, because the
   model's pace wanders sentence to sentence. Speed chips multiply through it,
   so "Normal" means the same speed on every sentence. */
const clipAdjust=si=>{const c=clipInfo(si); return (c&&c.adjust)||1;};

/* The speed chips were tuned for speechSynthesis, which *synthesises* slow
   speech cleanly. A recorded clip has to be time-stretched instead, which
   smears if pushed too far — so audio gets its own ladder. The chips keep
   their labels; the device voice keeps its original values.

   0.45 is where stretching was still clean by ear, on both a Mac and a phone
   (Safari and Chrome stretch differently, so both were checked). Clips also
   carry a pace adjustment of 0.80-1.13, and the two multiply, so the slowest
   chip is set where even the most-adjusted clip stays at or above that:
   0.57 x 0.80 = 0.456.

   Effective pace, against the 145 wpm the clips are normalised to:
     Very slow 83 | Slow 116 | Normal 145 | Fast 181                          */
const AUDIO_RATE={"0.4":0.57, "0.7":0.80, "1":1, "1.35":1.25};
const MIN_AUDIO_RATE=0.45;
function audioRate(){
  const base=AUDIO_RATE[String(rate)];
  return Math.max(MIN_AUDIO_RATE,(base===undefined?rate:base)*clipRateAdj);
}

function stopClip(){
  if(!clip) return;
  try{ clip.pause(); }catch(e){}
  clip.onended=clip.onerror=clip.onloadedmetadata=null;
  clip=null;
}
/* Walk the highlight across a sentence's words over a known duration, sharing
   the time out by word length. This is the same shape the boundary-less
   fallback has always used; audio just gives it a real duration to work with. */
function runWordTimer(marks,ms){
  const w=el=>el.textContent.length+1.5;
  const unit=marks.reduce((n,el)=>n+w(el),0)||1;
  let t=0;
  marks.forEach(el=>{
    timers.push(setTimeout(()=>{
      marks.forEach(x=>x.classList.remove("on")); el.classList.add("on");
    },t));
    t+=ms*w(el)/unit;
  });
}
const estimateMs=marks=>marks.reduce((n,el)=>n+el.textContent.length*62+90,0);

function playClip(url,marks,then,fallback,adjust){
  stopClip();
  clip=new Audio(url);
  clipRateAdj=adjust||1;
  clip.playbackRate=audioRate();
  // without this the speed chips would pitch-shift the narrator
  clip.preservesPitch=clip.mozPreservesPitch=clip.webkitPreservesPitch=true;
  const startTimer=()=>{
    const d=clip&&clip.duration;
    runWordTimer(marks,(d&&isFinite(d)?d*1000:estimateMs(marks))/audioRate());
  };
  if(clip.readyState>=1) startTimer(); else clip.onloadedmetadata=startTimer;
  clip.onended=()=>{
    marks.forEach(el=>el.classList.remove("on"));
    stopClip(); clearTimers();
    if(then) then();
  };
  // a missing or unplayable clip should not strand the reader
  clip.onerror=()=>{ stopClip(); clearTimers(); fallback(); };
  const pr=clip.play();
  if(pr&&pr.catch) pr.catch(()=>{ stopClip(); clearTimers(); fallback(); });
}

/* ---------- speaking ---------- */
function speakSentence(si,then){
  curSent=si;
  Track&&Track.log("sentence_read",{slug:slug,page:page+1,si:si,mode:mode,rate:rate});
  clearHi(); clearTimers(); stopClip();
  const sentEl=document.querySelector('.sent[data-si="'+si+'"]');
  if(sentEl) sentEl.classList.add("on");
  const marks=tokens[si];

  const url=clipUrl(si);
  if(url){ playClip(url,marks,then,()=>speakAloud(si,then),clipAdjust(si)); return; }
  speakAloud(si,then);
}
function speakAloud(si,then){
  const text=PAGES[page].s[si];
  const u=new SpeechSynthesisUtterance(text);
  if(voice) u.voice=voice;
  u.rate=rate; u.pitch=1.05;

  let gotBoundary=false;
  const marks=tokens[si];
  u.onboundary=e=>{
    if(e.name&&e.name!=="word") return;
    gotBoundary=true;
    let best=0;
    marks.forEach((el,i)=>{ if(+el.dataset.ci<=e.charIndex) best=i; });
    marks.forEach(el=>el.classList.remove("on"));
    if(marks[best]) marks[best].classList.add("on");
  };
  // fallback: if the browser gives us no word boundaries, estimate them
  timers.push(setTimeout(()=>{
    if(gotBoundary) return;
    runWordTimer(marks,estimateMs(marks)/rate);
  },350));

  u.onend=()=>{
    marks.forEach(el=>el.classList.remove("on"));
    clearTimers();
    if(then) then();
  };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function readPage(from){
  const total=PAGES[page].s.length;
  const step=si=>{
    if(!speaking||si>=total){
      const fin=(mode==="practice");
      stopAll(); if(fin) showResult();
      return;
    }
    speakSentence(si,()=>{
      if(!speaking) return;
      const el=document.querySelector('.sent[data-si="'+si+'"]');
      if(mode==="listen"){
        timers.push(setTimeout(()=>step(si+1),320));
      } else if(mode==="echo"){
        if(el) el.style.opacity=".5";
        $("hint").textContent="Your turn — read it out loud";
        timers.push(setTimeout(()=>{
          if(el) el.style.opacity="";
          $("hint").textContent="";
          step(si+1);
        },Math.max(1600,PAGES[page].s[si].length*80)));
      } else {
        listenTo(si,hit=>{
          if(hit){ scores.push({got:hit.filter(Boolean).length, all:hit.length});
            Track&&Track.log("practice_result",{slug:slug,page:page+1,
              got:hit.filter(Boolean).length, all:hit.length}); }
          $("hint").textContent="";
          if(!speaking) return;
          timers.push(setTimeout(()=>step(si+1),1100));
        });
      }
    });
  };
  step(from||0);
}
const LABEL={listen:"Read to me",echo:"Start — my turn",practice:"Start — score me"};
function stopAll(){
  speaking=false; speechSynthesis.cancel(); stopClip(); clearTimers(); clearHi();
  try{sr&&sr.stop()}catch(e){}

/* Must match word_key() in tools/tts.py, or the lookup misses. */
const wordKey=t=>String(t).toLowerCase().replace(/[^a-z]/g,"");
const REPLY_KEY={"yes! well done.":"_yes","not this time.":"_no"};
function wordClip(text){
  if(!AUDIO||!AUDIO.words) return null;
  const k=REPLY_KEY[String(text).toLowerCase().trim()]||wordKey(text);
  return k&&AUDIO.words[k] ? BASE+"audio/words/"+k+"."+(AUDIO.ext||"m4a") : null;
}
/* Single words and quiz replies come from the same narrator as the story when
   the book has them. `useDevice` is for the settings voice preview, which is
   the one place that genuinely has to demonstrate the device's own voice.
   A word the renderer could not produce falls through to speechSynthesis. */
function say(text,useDevice){
  speechSynthesis.cancel(); stopClip();
  const url=useDevice?null:wordClip(text);
  if(url){
    clipRateAdj=1;
    const a=new Audio(url);
    a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true;
    // a tapped word wants to be clear, so never as slow as the story can go
    a.playbackRate=Math.max(.85,audioRate());
    const pr=a.play();
    if(pr&&pr.catch) pr.catch(()=>sayAloud(text));
    return;
  }
  sayAloud(text);
}
function sayAloud(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice) u.voice=voice; u.rate=rate;
  speechSynthesis.speak(u);
}

/* ---------- listening and scoring ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const norm = w => w.toLowerCase()
  .replace(/[\u2018\u2019\u02BC\u00B4]/g,"'")   // curly apostrophes -> plain, so "won't" scores
  .replace(/[^a-z']/g,"");
function matchWords(said, expected){
  const n=said.length,m=expected.length,d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    d[i][j]= said[i]===expected[j] ? d[i+1][j+1]+1 : Math.max(d[i+1][j],d[i][j+1]);
  const hit=new Array(m).fill(false);
  let i=0,j=0;
  while(i<n&&j<m){
    if(said[i]===expected[j]){hit[j]=true;i++;j++;}
    else if(d[i+1][j]>=d[i][j+1]) i++; else j++;
  }
  return hit;
}
function listenTo(si,then){
  const marks=tokens[si];
  const expected=marks.map(el=>norm(el.textContent)).filter(Boolean);
  const btn=$("play"), hint=$("hint");
  const rest=()=>{btn.classList.remove("listening");btn.textContent="Stop";hint.classList.remove("big-hint")};
  if(!SR){ hint.textContent="Scoring needs Chrome."; then(null); return; }

  let done=false, best=null;
  const paint=(hit,final)=>{
    marks.forEach((el,k)=>{
      if(hit[k]){el.classList.add("ok");el.classList.remove("miss");}
      else if(final) el.classList.add("miss");
    });
  };
  const finish=()=>{
    if(done) return; done=true;
    try{sr&&sr.stop()}catch(e){}
    rest();
    if(best){ paint(best,true); then(best); }
    else{ hint.textContent="I did not hear that one"; then(null); }
  };

  sr=new SR();
  sr.lang="en-US"; sr.interimResults=true; sr.maxAlternatives=1;
  sr.onresult=e=>{
    let txt="";
    for(let k=0;k<e.results.length;k++) txt+=" "+e.results[k][0].transcript;
    const said=txt.split(/\s+/).map(norm).filter(Boolean);
    const hit=matchWords(said,expected);
    if(!best||hit.filter(Boolean).length>=best.filter(Boolean).length) best=hit;
    paint(hit,false);
    hint.textContent=hit.filter(Boolean).length+" of "+hit.length+" words";
    if(e.results[e.results.length-1].isFinal) finish();
  };
  sr.onerror=ev=>{
    if(ev&&(ev.error==="not-allowed"||ev.error==="service-not-allowed")){
      hint.textContent="Microphone blocked — serve the file from localhost";
    }
    finish();
  };
  sr.onend=()=>finish();

  btn.classList.add("listening"); btn.textContent="Listening…";
  hint.classList.add("big-hint");
  hint.textContent="Your turn — read it out loud";
  try{ sr.start(); }catch(e){ finish(); return; }
  timers.push(setTimeout(finish, Math.max(7000, PAGES[page].s[si].length*300)));
}
function showResult(){
  const got=scores.reduce((a,b)=>a+b.got,0), all=scores.reduce((a,b)=>a+b.all,0);

  const pct=Math.round(got/all*100);
  Track&&Track.log("page_result",{slug:slug,page:page+1,got:got,all:all,pct:pct});

  const d=document.createElement("div"); d.className="result"; d.id="result";
  d.innerHTML="<b>"+stars+"</b>You read "+got+" of "+all+" words clearly ("+pct+"%). Green words came through; pink ones were missed.";

}

/* ---------- teacher recording page ----------------------------------------
   Scoped to whichever story page is open. Clips live in memory and, base64'd,
   in localStorage so a reload does not lose them. Sharing is the way out;
   downloading each clip is the fallback. Lengths are measured with Date.now(),
   never read off audio.duration, which lies for MediaRecorder blobs.        */
(function(){
  let items = {};        // sentence index -> {blob, b64, ms, at}
  let rows  = [];        // per-sentence DOM refs
  let pageOf = -1, cur = 0;
  let trec = null, tstream = null, tidx = -1, tstart = 0, tchunks = [], tick = null;
  let audio = null, playing = -1;
  let storeWarn = "";

  /* ---- container format: audio/mp4 on Safari, audio/webm elsewhere ---- */
  const isSafari = /^((?!chrome|android|crios|fxios|edgios|edg\/).)*safari/i.test(navigator.userAgent);
  function pickMime(){
    if(typeof MediaRecorder === "undefined") return null;
    const can = m => { try{ return !MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(m); }
                       catch(e){ return false; } };
    for(const m of (isSafari ? ["audio/mp4","audio/webm"] : ["audio/webm","audio/mp4"]))
      if(can(m)) return m;
    return "";           // recorder exists but likes neither: let it choose
  }
  const MIME = pickMime();
  const EXT  = (MIME && MIME.indexOf("mp4") >= 0) ? "m4a" : "webm";

  /* ---- helpers ---- */
  const secs = ms => { const n = Math.max(1, Math.round(ms/1000));
                       return n + (n === 1 ? " second" : " seconds"); };
  function b64FromBlob(blob){
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => { const t = String(fr.result), i = t.indexOf(","); res(i < 0 ? "" : t.slice(i+1)); };
      fr.onerror = () => rej(fr.error || new Error("could not read the clip"));
      fr.readAsDataURL(blob);
    });
  }
  function blobFromB64(b64, mime){
    const bin = atob(b64), u = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new Blob([u], {type: mime || "application/octet-stream"});
  }
  const storeKey = () => "rec:" + slug + ":" + pageOf;

  function persist(){
    const out = {v:1, slug: slug, page: pageOf, mime: MIME, ext: EXT, items: {}};
    Object.keys(items).forEach(k => {
      if(items[k].b64) out.items[k] = {b64: items[k].b64, ms: items[k].ms, at: items[k].at};
    });
    try{
      localStorage.setItem(storeKey(), JSON.stringify(out));
      storeWarn = "";
    }catch(e){
      // usually the 5 MB localStorage ceiling
      storeWarn = "There is no room to keep these on the phone. They are safe on this screen, "
                + "but please send them before you leave it.";
    }
  }
  function restore(){
    items = {};
    let raw = null;
    try{ raw = localStorage.getItem(storeKey()); }catch(e){ return; }
    if(!raw) return;
    try{
      const d = JSON.parse(raw);
      if(d.slug !== slug || d.page !== pageOf) return;
      const n = PAGES[pageOf].s.length;
      Object.keys(d.items || {}).forEach(k => {
        const it = d.items[k];
        if(!it || !it.b64 || +k < 0 || +k >= n) return;
        items[k] = {blob: blobFromB64(it.b64, d.mime || MIME), b64: it.b64,
                    ms: it.ms || 0, at: it.at || 0};
      });
    }catch(e){ /* corrupt entry: start clean rather than crash */ }
  }

  function say(msg, warn){
    const el = $("tstatus");
    el.textContent = msg || "";
    el.classList.toggle("show", !!msg);
    el.classList.toggle("tbad", !!warn);
  }

  /* ---- playback ---- */
  function stopPlay(){
    if(audio){
      try{ audio.pause(); }catch(e){}
      if(audio.src) URL.revokeObjectURL(audio.src);
      audio = null;
    }
    playing = -1;
  }
  function play(i){
    const it = items[i];
    if(!it) return;
    if(playing === i){ stopPlay(); refresh(); return; }
    stopPlay();
    audio = new Audio(URL.createObjectURL(it.blob));
    playing = i;
    audio.onended = () => { stopPlay(); refresh(); };
    audio.onerror = () => { stopPlay(); refresh();
      say("That clip will not play back on this phone, but it will still send.", true); };
    const pr = audio.play();
    if(pr && pr.catch) pr.catch(() => { stopPlay(); refresh(); say("Tap the play button again.", true); });
    refresh();
  }

  /* ---- recording ---- */
  function dropStream(){
    if(tstream){ try{ tstream.getTracks().forEach(t => t.stop()); }catch(e){} tstream = null; }
  }
  function startTick(){ stopTick(); tick = setInterval(refresh, 250); }
  function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
  const recording = () => !!(trec && trec.state === "recording");

  function stopRec(){ if(recording()){ try{ trec.stop(); }catch(e){} } }

  async function startRec(i){
    if(recording()){ stopRec(); return; }
    if(typeof MediaRecorder === "undefined"){
      say("This phone cannot record sound in this browser. Please try Safari or Chrome.", true); return;
    }
    stopPlay(); refresh();
    say("");
    try{
      tstream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      dropStream();
      say("I could not switch the microphone on. Tap the red button again and choose Allow.", true);
      return;
    }
    tchunks = [];
    try{
      trec = MIME ? new MediaRecorder(tstream, {mimeType: MIME}) : new MediaRecorder(tstream);
    }catch(e){
      try{ trec = new MediaRecorder(tstream); }
      catch(e2){ dropStream(); say("This phone cannot record sound here.", true); return; }
    }
    tidx = i;
    trec.ondataavailable = e => { if(e.data && e.data.size) tchunks.push(e.data); };
    trec.onstop = () => {
      const ms   = Date.now() - tstart;             // measured, not audio.duration
      const type = (trec && trec.mimeType) || MIME || "audio/webm";
      const blob = new Blob(tchunks, {type: type});
      const idx  = tidx;
      dropStream(); stopTick();
      tidx = -1; trec = null; tchunks = [];
      if(!blob.size || ms < 400){
        say("That was too short to keep. Tap the red button and read the sentence again.", true);
        refresh();
        return;
      }
      items[idx] = {blob: blob, b64: "", ms: ms, at: Date.now()};
      refresh();
      cur = Math.min(idx + 1, PAGES[pageOf].s.length - 1);   // auto-advance
      b64FromBlob(blob).then(b => { items[idx].b64 = b; persist(); refresh(); })
                       .catch(() => { persist(); refresh(); });
      refresh();
      const nx = rows[cur];
      if(nx && cur !== idx) nx.row.scrollIntoView({behavior:"smooth", block:"center"});
    };
    tstart = Date.now();
    try{ trec.start(); }
    catch(e){ dropStream(); trec = null; tidx = -1; say("Recording would not start. Please try again.", true); return; }
    startTick(); refresh();
  }

  /* ---- render ---- */
  function build(){
    const box = $("trows");
    box.innerHTML = "";
    rows = [];
    PAGES[pageOf].s.forEach((sent, i) => {
      const row = document.createElement("div"); row.className = "trow";
      const txt = document.createElement("div"); txt.className = "ttext";
      const num = document.createElement("span"); num.className = "tnum"; num.textContent = (i+1) + ". ";
      txt.appendChild(num);
      txt.appendChild(document.createTextNode(sent));
      const meta = document.createElement("div"); meta.className = "tmeta";
      txt.appendChild(meta);
      const rb = document.createElement("button"); rb.className = "tbtn"; rb.type = "button";
      rb.onclick = () => { if(recording()) stopRec(); else startRec(i); };
      const pb = document.createElement("button"); pb.className = "tplay"; pb.type = "button";
      pb.onclick = () => play(i);
      row.appendChild(txt); row.appendChild(rb); row.appendChild(pb);
      box.appendChild(row);
      rows.push({row: row, rb: rb, pb: pb, meta: meta});
    });
  }
  function refresh(){
    if(pageOf < 0 || !rows.length) return;
    const n = PAGES[pageOf].s.length;
    let done = 0;
    rows.forEach((r, i) => {
      const it = items[i], live = recording() && tidx === i;
      if(it) done++;
      r.row.classList.toggle("live", live);
      r.row.classList.toggle("cur",  i === cur && !live);
      r.row.classList.toggle("tdone", !!it && !live);
      r.rb.innerHTML   = live ? "&#9632;" : "&#9679;";
      r.rb.setAttribute("aria-label", (live ? "Stop recording sentence " : "Record sentence ") + (i+1));
      r.pb.innerHTML   = playing === i ? "&#9632;" : "&#9654;";
      r.pb.disabled    = !it || live;
      r.pb.setAttribute("aria-label", "Play sentence " + (i+1));
      r.meta.textContent = live ? "Recording " + secs(Date.now() - tstart) + " — tap the square to stop"
                         : it   ? "Recorded " + secs(it.ms) + (it.b64 ? "" : " — saving…")
                                : "Not recorded yet";
    });
    $("tprog").textContent = done + " of " + n + " recorded";
    const btn = $("tsend");
    btn.disabled    = !done || recording();
    btn.textContent = done ? "Send these recordings" : "Record a sentence first";
    $("tnote").textContent = done
      ? "They all go together as one file: " + zipName()
      : "The recordings stay on this phone until you send them.";
    if(storeWarn && !$("tstatus").classList.contains("tbad")) say(storeWarn, true);
  }

  /* ---- sending: everything leaves as one .zip -------------------------
     Written by hand because the page carries no libraries. Entries are
     STORED, not deflated: the clips are already Opus/AAC and JSON this
     small gains nothing, and storing keeps the whole build synchronous,
     which is what lets navigator.share() stay inside the tap.          */
  let CRCT = null;
  function crcTable(){
    if(CRCT) return CRCT;
    CRCT = new Uint32Array(256);
    for(let n = 0; n < 256; n++){
      let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRCT[n] = c >>> 0;
    }
    return CRCT;
  }
  function crc32(u8){
    const t = crcTable();
    let c = 0xFFFFFFFF;
    for(let i = 0; i < u8.length; i++) c = t[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const dosTime = d => ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5)
                     | ((d.getSeconds() >> 1) & 31);
  const dosDate = d => (((d.getFullYear() - 1980) & 127) << 9)
                     | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);

  function makeZip(entries){
    const te = (typeof TextEncoder !== "undefined") ? new TextEncoder() : null;
    const nameBytes = n => {
      if(te) return te.encode(n);
      const u = new Uint8Array(n.length);
      for(let i = 0; i < n.length; i++) u[i] = n.charCodeAt(i) & 0xFF;
      return u;
    };
    const flags = te ? 0x0800 : 0;              // bit 11 = names are UTF-8
    const body = [], central = [];
    let offset = 0;

    entries.forEach(e => {
      const nb = nameBytes(e.name), size = e.bytes.length, crc = crc32(e.bytes);
      const when = e.date || new Date();
      const tm = dosTime(when), dt = dosDate(when);

      const lh = new Uint8Array(30 + nb.length), lv = new DataView(lh.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);                // version needed
      lv.setUint16(6, flags, true);
      lv.setUint16(8, 0, true);                 // 0 = stored
      lv.setUint16(10, tm, true); lv.setUint16(12, dt, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, size, true); lv.setUint32(22, size, true);
      lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
      lh.set(nb, 30);
      body.push(lh, e.bytes);

      const ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
      cv.setUint16(8, flags, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, tm, true); cv.setUint16(14, dt, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true); cv.setUint32(24, size, true);
      cv.setUint16(28, nb.length, true);
      cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true); cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);           // where its local header sits
      ch.set(nb, 46);
      central.push(ch);

      offset += lh.length + size;
    });

    const cdSize = central.reduce((n, c) => n + c.length, 0);
    const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
    ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    return new Blob(body.concat(central, [eo]), {type: "application/zip"});
  }

  /* base64 -> bytes, cached on the item so a second tap costs nothing */
  function bytesOf(i){
    const it = items[i];
    if(!it) return null;
    if(it.bytes) return it.bytes;
    if(!it.b64) return null;
    const bin = atob(it.b64), u = new Uint8Array(bin.length);
    for(let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
    it.bytes = u;
    return u;
  }
  const stillSaving = () => Object.keys(items).some(k => !items[k].b64);
  const zipName = () => slug + "_page" + (pageOf + 1) + ".zip";

  function entriesForPage(){
    const n = PAGES[pageOf].s.length, out = [];
    const timings = {
      book: slug,
      title: (BOOK && BOOK.title) || slug,
      page: pageOf + 1,
      pagesInBook: PAGES.length,
      container: MIME || "browser default",
      note: "ms is wall-clock time measured while recording, not decoded audio duration",
      sentences: []
    };
    for(let i = 0; i < n; i++){
      const it = items[i], bytes = bytesOf(i);
      if(!it || !bytes) continue;
      const name = "p" + (pageOf+1) + "_s" + (i+1) + "." + EXT;
      out.push({name: name, bytes: bytes, date: new Date(it.at),
                type: it.blob.type || MIME || "application/octet-stream"});
      timings.sentences.push({
        file: name, sentence: i + 1, text: PAGES[pageOf].s[i],
        ms: it.ms, seconds: +(it.ms/1000).toFixed(2),
        recordedAt: new Date(it.at).toISOString()
      });
    }
    if(!out.length) return null;
    const json = JSON.stringify(timings, null, 1);
    const jb = (typeof TextEncoder !== "undefined")
      ? new TextEncoder().encode(json)
      : (function(){ const u = new Uint8Array(json.length);
                     for(let i = 0; i < json.length; i++) u[i] = json.charCodeAt(i) & 0xFF;
                     return u; })();
    out.push({name: "timings.json", bytes: jb, date: new Date(), type: "application/json"});
    return out;
  }

  function download(ps, why){
    const many = ps.length > 1;
    say(why + " Saving " + (many ? "each recording" : "the file")
        + " to this phone instead — look in your Files or Downloads.", true);
    ps.forEach((p, k) => setTimeout(() => {
      const u = URL.createObjectURL(p.blob);
      const a = document.createElement("a");
      a.href = u; a.download = p.name; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 30000);
    }, k * 600));
  }

  function shareFiles(files, onFail){
    let why = "";
    if(!navigator.share)                         why = "This browser cannot open the share sheet.";
    else if(!navigator.canShare)                 why = "This browser cannot check whether it can share files.";
    else if(!navigator.canShare({files: files})) why = "This browser will not share this file.";
    if(why){ onFail(why); return; }
    navigator.share({files: files}).then(() => {
      say("Sent. Thank you!");
    }).catch(err => {
      const nm = (err && err.name) || "";
      if(nm === "AbortError"){ say(""); return; }        // teacher closed the sheet
      onFail("The share sheet did not open (" + (nm || "unknown error") + ").");
    });
  }

  function send(){
    const entries = entriesForPage();
    if(!entries){ say("Record at least one sentence first.", true); return; }
    if(stillSaving()){ say("Still saving the last recording — tap Send again in a moment.", true); return; }

    // one zip, built synchronously so the tap still counts as a user gesture
    let zip = null;
    try{ zip = makeZip(entries); }catch(e){ zip = null; }

    if(zip){
      const one = [{name: zipName(), blob: zip}];
      if(typeof File === "function"){
        let zf = null;
        try{ zf = new File([zip], zipName(), {type: "application/zip"}); }catch(e){ zf = null; }
        if(zf){ shareFiles([zf], why => download(one, why)); return; }
      }
      download(one, "This browser cannot share files.");
      return;
    }

    // zip could not be built at all: fall back to the clips on their own
    const ps = entries.map(e => ({name: e.name, blob: new Blob([e.bytes], {type: e.type})}));
    if(typeof File !== "function"){
      download(ps, "This browser cannot package the recordings."); return;
    }
    let files = null;
    try{ files = ps.map(p => new File([p.blob], p.name, {type: p.blob.type})); }catch(e){ files = null; }
    if(!files){ download(ps, "This browser cannot package the recordings."); return; }
    shareFiles(files, why => download(ps, why));
  }

  /* ---- open / close ---- */
  function open(){
    if(!PAGES.length) return;
    stopAll();
    if(typeof mr !== "undefined" && mr && mr.state === "recording"){ try{ mr.stop(); }catch(e){} }
    openSheet(false);
    pageOf = page;
    cur = 0;
    storeWarn = "";
    restore();
    build();
    say("");
    $("ttitle").textContent = "Page " + (pageOf + 1) + " of " + PAGES.length
                            + " · " + PAGES[pageOf].s.length + " sentences";
    $("tpage").classList.add("open");
    $("tpage").scrollTop = 0;
    refresh();
  }
  function close(){
    stopRec(); stopPlay(); stopTick();
    $("tpage").classList.remove("open");
    refresh();
  }

  $("teachbtn").onclick = open;
  $("tback").onclick    = close;
  $("tsend").onclick    = send;
})();

loadBook();
</script>
</body>
</html>
