<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roberta's Reading App</title>
<style>
:root{
  --paper:#FFFDF7;
  --ink:#1E1B18;
  --faded:#A9A29A;
  --crayon-green:#4E9A3E;
  --crayon-red:#D93A2B;
  --sun:#FFD23F;
  --line:#E4DED2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#243138;color:var(--ink);min-height:100%}
body{
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Avenir Next",system-ui,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
}

/* ---------- phone frame (same as the reader) ---------- */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:26px 16px}
.device{position:relative;width:390px;height:min(844px,90vh);flex:none;
  background:#0E1214;border-radius:46px;padding:11px;
  box-shadow:0 0 0 2px #3A474E,0 30px 60px rgba(0,0,0,.45)}
.island{position:absolute;top:20px;left:50%;transform:translateX(-50%);
  width:104px;height:26px;background:#0E1214;border-radius:999px;z-index:20;pointer-events:none}
.screen{position:relative;height:100%;width:100%;overflow-y:auto;overflow-x:hidden;
  border-radius:36px;background:var(--paper);-webkit-overflow-scrolling:touch}
.stagenote{color:#8FA0A9;font-size:13px;margin:0;text-align:center}
@media (max-width:760px){
  .stage{padding:0;min-height:100dvh;gap:0}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .island{display:none}
  .screen{border-radius:0}
  .stagenote{display:none}
}

.wrap{max-width:520px;margin:0 auto;padding:44px 18px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.15;margin:6px 0 2px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--faded);font-size:14px;margin:0 0 22px}

/* ---------- shelf ---------- */
.shelf{display:flex;flex-direction:column;gap:14px}
.card{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
  border:2px solid var(--line);border-radius:18px;padding:13px 15px;background:var(--paper);
  transition:transform .12s,box-shadow .12s}
.card:active{transform:translateY(2px)}
@media (hover:hover){ .card:hover{box-shadow:0 6px 18px rgba(30,27,24,.12)} }
.card img{width:66px;height:auto;flex:none;border-radius:3px;
  box-shadow:0 4px 12px rgba(30,27,24,.18);transform:rotate(-1.6deg);background:#fff}
.card .meta{min-width:0}
.card b{display:block;font-size:20px;font-weight:800;line-height:1.2;margin-bottom:3px}
.card .n{font-size:13px;color:var(--faded)}
.card .go{margin-left:auto;font-size:26px;color:var(--faded);flex:none}

.note{margin-top:26px;font-size:12px;color:var(--faded);line-height:1.6}
.note a{color:var(--faded)}
.oops{color:var(--crayon-red);font-size:15px;font-weight:700;line-height:1.5}
.oops code{background:#F0EAE0;border-radius:5px;padding:1px 5px;font-size:13px}
.skel{height:96px;border-radius:18px;background:#F0EAE0;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>
</head>
<body>

<div class="stage">
<div class="device">
<div class="island"></div>
<div class="screen">
  <div class="wrap">
    <h1>Roberta&rsquo;s Reading App</h1>
    <p class="sub">Pick a book to read.</p>
    <div class="shelf" id="shelf"><div class="skel"></div></div>
    <p class="note" id="note"></p>
  </div>
</div>
</div><!--device-->
<p class="stagenote">Phone preview — resize narrow, or open on a phone, for the real thing</p>
</div><!--stage-->

<script src="track.js?v=1789210708"></script>
<script src="who.js?v=1789210708"></script>
<script>
const $=id=>document.getElementById(id);

function oops(msg){
  $("shelf").innerHTML='<p class="oops">'+msg+'</p>';
}

async function build(){
  let slugs;
  try{
    const res=await fetch("books.json",{cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const man=await res.json();
    slugs=Array.isArray(man)?man:man.books;
    if(!Array.isArray(slugs)) throw new Error("books.json has no book list");
  }catch(err){
    oops(location.protocol==="file:"
      ? 'This page needs a web server. Run <code>python3 -m http.server</code> in the project folder, then open <code>localhost:8000</code>.'
      : 'Could not load the book list. ('+err.message+')');
    return;
  }

  // fetch every book's details at once, then keep books.json's order
  const books=await Promise.all(slugs.map(async slug=>{
    try{
      const r=await fetch("books/"+slug+"/book.json",{cache:"no-cache"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      const b=await r.json();
      return {slug, title:b.title||slug, pages:(b.pages||[]).length,
              cover:"books/"+slug+"/"+(b.cover||"cover.webp")};
    }catch(err){
      console.warn("skipping "+slug+":",err.message);
      return null;
    }
  }));

  const ok=books.filter(Boolean);
  if(!ok.length){ oops("No books found yet."); return; }

  const shelf=$("shelf"); shelf.innerHTML="";
  ok.forEach(b=>{
    const a=document.createElement("a");
    a.className="card"; a.href="reader.html?book="+encodeURIComponent(b.slug)
      +(Who&&Who.current()?"&s="+Who.current().code:"");
    const im=document.createElement("img");
    im.src=b.cover; im.alt=b.title+" cover"; im.loading="lazy";
    const meta=document.createElement("div"); meta.className="meta";
    const t=document.createElement("b"); t.textContent=b.title;
    const n=document.createElement("div"); n.className="n";
    n.textContent=b.pages+(b.pages===1?" page":" pages");
    meta.appendChild(t); meta.appendChild(n);
    const go=document.createElement("span"); go.className="go"; go.textContent="›";
    a.appendChild(im); a.appendChild(meta); a.appendChild(go);
    shelf.appendChild(a);
  });

  const missing=books.length-ok.length;
  $("note").innerHTML=(missing?missing+" book"+(missing>1?"s":"")+" could not be loaded.<br>":"")
    +'Works best in Chrome. Read-aloud uses your device voice; scoring needs a microphone.';
}
build();
</script>
</body>
</html>
<script>
// the book grid and the "who is reading" screen resolve independently, so
// stamp the child onto the links whichever finishes first
function tagLinks(){
  const w = Who && Who.current(); if(!w) return;
  document.querySelectorAll('a.card[href^="reader.html"]').forEach(a=>{
    if(a.href.indexOf("&s=")<0) a.href += "&s=" + w.code;
  });
}
document.addEventListener("who", tagLinks);
new MutationObserver(tagLinks).observe(document.body,{childList:true,subtree:true});
Who&&Who.init();
</script>
